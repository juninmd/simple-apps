[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cep-lookup-cli"
version = "0.1.0"
description = "A command-line tool that lets developers and users quickly look up Brazilian postal codes (CEP) via ViaCEP API."
readme = "README.md"
authors = [{ name = "Antonio Carlos" }]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
cep-lookup = "cep_lookup.cli:main"
