[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extract-acts"
version = "0.1.0"
description = "Turn meeting transcripts into checkable task lists without leaving the terminal."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Antonio Carlos" }
]
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.20.0",
    "pydantic>=2.0.0",
    "textual>=0.80.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
extract-acts = "extract_acts.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # Pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
]
ignore = [
    "COM812",   # trailing comma conflict
    "ISC001",   # implicit string concat conflict
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
