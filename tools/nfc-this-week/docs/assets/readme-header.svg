<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" rx="20" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#fff" stroke-width="1">
    <path d="M0,80 H1280 M0,160 H1280 M0,240 H1280 M0,320 H1280 M0,400 H1280 M0,480 H1280 M0,560 H1280" />
    <path d="M160,0 V640 M320,0 V640 M480,0 V640 M640,0 V640 M800,0 V640 M960,0 V640 M1120,0 V640" />
  </g>

  <!-- Left: Branding & Pitch -->
  <g transform="translate(80, 100)">
    <!-- Icon -->
    <rect width="64" height="64" rx="14" fill="url(#accentGrad)" filter="url(#shadow)"/>
    <text x="32" y="42" font-size="32" text-anchor="middle">🧾</text>

    <text x="0" y="130" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">nfc-this-week</text>
    <text x="0" y="180" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600">Scan receipt. Split the bill. No typing. No cloud.</text>

    <text x="0" y="240" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      <tspan x="0" dy="0">• 100% Client-Side Privacy (Zero Cloud / No Account)</tspan>
      <tspan x="0" dy="30">• Complete Scan &rarr; Export unassisted in &lt; 2 minutes</tspan>
      <tspan x="0" dy="30">• Passes the Antonio non-technical accessibility test</tspan>
      <tspan x="0" dy="30">• Direct Brazilian SEFAZ NFC-e QR parsing</tspan>
    </text>

    <!-- Badges pill -->
    <g transform="translate(0, 380)">
      <rect width="130" height="34" rx="17" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="65" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ZERO CLOUD</text>

      <rect x="142" width="160" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
      <text x="222" y="22" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ANTONIO CERTIFIED</text>
    </g>
  </g>

  <!-- Right: Card Preview of App Flow -->
  <g transform="translate(680, 100)" filter="url(#shadow)">
    <!-- App mockup window -->
    <rect width="520" height="440" rx="16" fill="#131c2e" stroke="#1e293b" stroke-width="2"/>

    <!-- Window header bar -->
    <rect width="520" height="44" rx="16" fill="#0f172a"/>
    <rect y="28" width="520" height="16" fill="#0f172a"/>
    <circle cx="24" cy="22" r="6" fill="#ef4444"/>
    <circle cx="44" cy="22" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="22" r="6" fill="#10b981"/>
    <text x="260" y="27" fill="#64748b" font-family="monospace" font-size="12" text-anchor="middle">nfc-this-week · scan &rarr; split &rarr; export</text>

    <!-- Simulated Content inside Mockup -->
    <!-- Stepper -->
    <g transform="translate(24, 60)">
      <rect width="110" height="28" rx="6" fill="#064e3b" stroke="#10b981"/>
      <text x="55" y="18" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1. Scan</text>

      <rect x="120" width="110" height="28" rx="6" fill="#1e293b"/>
      <text x="175" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">2. Parse</text>

      <rect x="240" width="110" height="28" rx="6" fill="#1e293b"/>
      <text x="295" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">3. Split</text>

      <rect x="360" width="110" height="28" rx="6" fill="#1e293b"/>
      <text x="415" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">4. Export</text>
    </g>

    <!-- Scanner Target Mockup -->
    <rect x="40" y="110" width="440" height="160" rx="10" fill="#090d16" stroke="#334155" stroke-dasharray="4 4"/>
    <rect x="185" y="130" width="150" height="100" rx="8" fill="#064e3b" opacity="0.1" stroke="#10b981" stroke-width="2"/>
    <line x1="185" y1="180" x2="335" y2="180" stroke="#34d399" stroke-width="3"/>
    <text x="260" y="195" font-size="30" text-anchor="middle">📷</text>
    <text x="260" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">NFC-e Fiscal QR Code Detected (0.4s)</text>

    <!-- Parsed Results summary banner -->
    <rect x="40" y="290" width="440" height="110" rx="10" fill="#0f172a" stroke="#1e293b"/>
    <text x="60" y="325" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Restaurante Recanto das Flores &bull; R$ 145,50</text>
    <text x="60" y="350" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">👤 Antonio: R$ 81,75 &bull; 👤 Carlos: R$ 63,75</text>

    <rect x="60" y="365" width="160" height="24" rx="6" fill="#38bdf8"/>
    <text x="140" y="381" fill="#082f49" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">📲 WhatsApp PIX Copied</text>
  </g>
</svg>
